<main>

<header>
  <div>
    <div class="logo">ARIES</div>
    <div class="muted">SMART ACCESS</div>
  </div>
  <div class="row">
    <span class="dot" id="connectionDot"></span>
    <span id="connectionText">OFFLINE</span>
  </div>
</header>

<!-- STATUS -->
<section class="card">
  <div class="muted">STATUS PINTU</div>
  <div id="doorState">MENUNGGU</div>
  <div class="muted" id="doorDesc">Menunggu ESP32</div>
</section>

<!-- NUMPAD -->
<section class="card">
  <div class="row">
    <strong>MASUKKAN PIN</strong>
    <span class="muted" id="pinCount">0/8</span>
  </div>

  <div class="pin-display" id="pinDisplay">••••••</div>

  <div class="keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>

    </button>

    </button>

</section>

<!-- MENU -->
<section class="card">
  <div class="menu">
    <button onclick="showPanel('historyPanel')">
      <span>◷</span>HISTORI
    </button>
    <button onclick="showPanel('pinPanel')">
      <span>⚿</span>GANTI PIN
    </button>
    <button onclick="showPanel('settingsPanel')">
      <span>⚙</span>PENGATURAN
    </button>
  </div>
</section>

<!-- HISTORI -->
<section class="card hidden" id="historyPanel">
  <div class="row">
    <strong>HISTORI AKTIVITAS</strong>
    <button class="secondary" style="width:auto"
      onclick="closePanels()">TUTUP</button>
  </div>

  <div id="historyList" style="margin-top:15px"></div>

  <button class="danger" onclick="clearHistory()">
    HAPUS HISTORI
  </button>
</section>

<!-- GANTI PIN -->
<section class="card hidden" id="pinPanel">
  <div class="row">
    <strong>GANTI PIN</strong>
    <button class="secondary" style="width:auto"
      onclick="closePanels()">TUTUP</button>
  </div>

  <label class="muted">PIN LAMA</label>
  <input id="oldPin" type="password"
    inputmode="numeric" maxlength="8" placeholder="PIN lama">

  <label class="muted">PIN BARU</label>
  <input id="newPin" type="password"
    inputmode="numeric" maxlength="8" placeholder="4-8 angka">

  <label class="muted">ULANGI PIN BARU</label>
  <input id="confirmPin" type="password"
    inputmode="numeric" maxlength="8" placeholder="Ulangi PIN">

  <button class="primary" onclick="changePin()">
    SIMPAN PIN
  </button>
  <p class="muted" id="changeMessage"></p>
</section>

<!-- PENGATURAN -->
<section class="card hidden" id="settingsPanel">
  <div class="row">
    <strong>PENGATURAN</strong>
    <button class="secondary" style="width:auto"
      onclick="closePanels()">TUTUP</button>
  </div>

  <p class="muted">Aplikasi ARIES</p>
  <p class="muted">Versi 1.0</p>

  <button class="secondary" onclick="resetPin()">
    RESET PIN DEMO
  </button>
</section>

<!-- AKTIVITAS TERBARU -->
<section class="card">
  <div class="muted">AKTIVITAS TERBARU</div>
  <p id="log">Memulai koneksi...</p>
</section>

<footer>ARIES • SMART DOOR LOCK</footer>

</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>
// =====================================
// MQTT - KONFIGURASI ASLI WOKWI
// =====================================

const DEVICE_ID = "ariesharianto-smartlock-demo-7f3a91";
const DEMO_TOKEN = "ARIES-DEMO-LOCK-7F3A91";

const TOPIC_COMMAND = DEVICE_ID + "/command";
const TOPIC_STATUS = DEVICE_ID + "/status";
const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";

// =====================================
// DATA LOKAL
// =====================================

const DEFAULT_PIN = "123456";
const PIN_KEY = "aries_pin";
const HISTORY_KEY = "aries_history";

let enteredPin = "";
let client = null;

const $ = id => document.getElementById(id);

function getPin() {
  return localStorage.getItem(PIN_KEY) || DEFAULT_PIN;
}

function saveHistory(message) {
  let history = JSON.parse(
    localStorage.getItem(HISTORY_KEY) || "[]"
  );

  history.unshift({
    message,
    time: new Date().toLocaleString("id-ID")
  });

  history = history.slice(0,50);

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(
    localStorage.getItem(HISTORY_KEY) || "[]"
  );

  $("historyList").innerHTML = "";

  if(!history.length) {
    $("historyList").textContent = "Belum ada aktivitas.";
    return;
  }

  history.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";

    const title = document.createElement("div");
    title.textContent = item.message;

    const time = document.createElement("div");
    time.className = "muted";
    time.textContent = item.time;

    div.append(title,time);
    $("historyList").appendChild(div);
  });
}

function clearHistory() {
  if(!confirm("Hapus semua histori?")) return;

  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

renderHistory();

// =====================================
// NUMPAD
// =====================================

function updatePinDisplay() {
  $("pinDisplay").textContent =
    enteredPin.length
      ? "●".repeat(enteredPin.length)
      : "••••••";

  $("pinCount").textContent =
    enteredPin.length + "/8";
}

document.querySelectorAll("[data-key]").forEach(button => {

  button.addEventListener("click",() => {

    const key = button.dataset.key;

    if(key === "clear") {
      enteredPin = "";
    }
    else if(key === "back") {
      enteredPin = enteredPin.slice(0,-1);
    }
    else if(enteredPin.length < 8) {
      enteredPin += key;
    }

    updatePinDisplay();
    $("pinMessage").textContent = "";
  });
});

function clearPin() {
  enteredPin = "";
  updatePinDisplay();
}

// =====================================
// GANTI PIN
// =====================================

function changePin() {

  const oldPin = $("oldPin").value;
  const newPin = $("newPin").value;
  const confirmPin = $("confirmPin").value;

  if(oldPin !== getPin()) {
    $("changeMessage").textContent = "PIN lama salah.";
    return;
  }

  if(!/^\d{4,8}$/.test(newPin)) {
    $("changeMessage").textContent =
      "PIN baru harus 4 sampai 8 angka.";
    return;
  }

  if(newPin !== confirmPin) {
    $("changeMessage").textContent =
      "Konfirmasi PIN tidak cocok.";
    return;
  }

  localStorage.setItem(PIN_KEY,newPin);

  $("changeMessage").textContent =
    "PIN berhasil diganti.";

  $("oldPin").value = "";
  $("newPin").value = "";
  $("confirmPin").value = "";

  saveHistory("PIN berhasil diganti");
}

function resetPin() {
  if(!confirm("Kembalikan PIN ke 123456?")) return;

  localStorage.removeItem(PIN_KEY);
  saveHistory("PIN demo direset");
  alert("PIN demo kembali menjadi 123456.");
}

// =====================================
// MENU
// =====================================

function showPanel(id) {
  closePanels();
  $(id).classList.remove("hidden");

  if(id === "historyPanel") renderHistory();

  $(id).scrollIntoView({
    behavior:"smooth",
    block:"nearest"
  });
}

function closePanels() {
  ["historyPanel","pinPanel","settingsPanel"]
    .forEach(id => $(id).classList.add("hidden"));
}

// =====================================
// KONEKSI MQTT
// =====================================

function setConnection(connected,text) {

  $("connectionDot").className =
    connected ? "dot on" : "dot";

  $("connectionText").textContent = text;

  $("unlock").disabled = !connected;
  $("lock").disabled = !connected;
}

function showStatus(message) {

  const state = message.split("|")[0];

  if(state === "UNLOCKED") {
    $("doorState").textContent = "TERBUKA";
    $("doorState").style.color = "#22c55e";
    $("doorDesc").textContent =
      "ESP32 mengonfirmasi pintu terbuka.";

    saveHistory("Pintu terbuka (konfirmasi ESP32)");
  }

  else if(state === "LOCKED") {
    $("doorState").textContent = "TERKUNCI";
    $("doorState").style.color = "#cbd5e1";
    $("doorDesc").textContent =
      "ESP32 mengonfirmasi pintu terkunci.";

    saveHistory("Pintu terkunci (konfirmasi ESP32)");
  }

  else return;

  $("log").textContent =
    "Status diterima: " +
    new Date().toLocaleTimeString();
}

function sendCommand(command) {

  if(!client || !client.connected) return;

  client.publish(
    TOPIC_COMMAND,
    command + "|" + DEMO_TOKEN,
    {qos:0,retain:false}
  );

  $("log").textContent =
    "Perintah " + command + " dikirim. Menunggu ESP32...";

  saveHistory(
    command === "UNLOCK"
      ? "Perintah buka dikirim"
      : "Perintah kunci dikirim"
  );
}

// =====================================
// BUKA DAN KUNCI PINTU
// =====================================

$("unlock").addEventListener("click",() => {

  if(enteredPin !== getPin()) {
    $("pinMessage").textContent = "PIN SALAH!";
    saveHistory("Percobaan PIN salah");
    clearPin();
    return;
  }

  sendCommand("UNLOCK");
  $("pinMessage").textContent = "PIN benar. Perintah dikirim.";
  clearPin();
});

$("lock").addEventListener("click",() => {
  sendCommand("LOCK");
  clearPin();
});

// =====================================
// START MQTT
// =====================================

function startMQTT() {

  if(typeof mqtt === "undefined") {
    $("log").textContent = "MQTT.js gagal dimuat.";
    return;
  }

  const clientId =
    "webSmartLock_" + Math.random().toString(16).slice(2,10);

  client = mqtt.connect(BROKER_URL,{
    clientId,
    clean:true,
    connectTimeout:10000,
    reconnectPeriod:3000
  });

  client.on("connect",() => {

    setConnection(true,"ONLINE");

    client.subscribe(TOPIC_STATUS,{qos:0},err => {
      $("log").textContent = err
        ? "Gagal subscribe: " + err.message
        : "Terhubung ke broker EMQX.";
    });
  });

  client.on("reconnect",() =>
    setConnection(false,"MENGHUBUNGKAN...")
  );

  client.on("offline",() =>
    setConnection(false,"OFFLINE")
  );

  client.on("error",err => {
    setConnection(false,"ERROR");
    $("log").textContent = "MQTT: " + err.message;
  });

  client.on("message",(topic,payload) => {
    if(topic === TOPIC_STATUS) {
      showStatus(payload.toString());
    }
  });
}

startMQTT();
</script>

</body>
</html>
