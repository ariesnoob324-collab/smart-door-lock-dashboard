<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d17">
<title>ARIES</title>

<style>
:root {
  --bg:#080d17;
  --panel:#111c2d;
  --line:#25344a;
  --muted:#91a3ba;
  --blue:#38bdf8;
  --green:#22c55e;
}
* {box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:white;
  font-family:system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
main {width:100%;max-width:420px}
header {text-align:center;margin-bottom:30px}
.logo {font-size:42px;font-weight:900;letter-spacing:5px}
.sub {font-size:11px;color:var(--muted);letter-spacing:3px}
.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:23px;
  padding:24px;
  margin-bottom:15px;
}
h2 {font-size:25px;margin:0 0 22px}
input {
  width:100%;
  padding:17px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#080d17;
  color:white;
  font-size:17px;
  outline:none;
}
button {
  width:100%;
  border:0;
  border-radius:14px;
  padding:18px;
  font-size:17px;
  font-weight:800;
  color:white;
  cursor:pointer;
  margin-top:12px;
}
button:disabled {opacity:.4}
.primary {background:#0369a1}
.fingerprint {background:#1e293b}
.hidden {display:none!important}
.muted {color:var(--muted);font-size:13px}
.status {
  font-size:34px;
  font-weight:900;
  margin:15px 0 5px;
}
.online {color:var(--green)}
.offline {color:#fb7185}
.actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}
.actions button {height:85px;margin:0}
.open {background:#15803d}
.close {background:#334155}
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.dot {
  display:inline-block;
  width:9px;height:9px;
  border-radius:50%;
  background:#64748b;
  margin-right:7px;
}
.dot.on {background:var(--green)}
#log {
  font-size:12px;
  color:var(--muted);
  min-height:18px;
  margin-top:18px;
  word-break:break-word;
}
.logout {
  background:#263449;
  font-size:14px;
}
</style>
</head>

<body>
<main>

<header>
  <div class="logo">ARIES</div>
  <div class="sub">SMART ACCESS</div>
</header>

<!-- LOGIN -->
<section id="login" class="card">
  <h2>Selamat datang</h2>

  <input id="password" type="password"
  placeholder="Password">

  <button class="primary" onclick="loginPassword()">
    MASUK
  </button>

  <button class="fingerprint" onclick="loginFingerprint()">
    <span style="font-size:24px">◎</span><br>
    FINGERPRINT
  </button>

  <p class="muted" id="loginMessage"></p>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="hidden">

  <div class="card">
    <div class="top">
      <span class="muted">KONEKSI</span>
      <span class="muted" id="connectionText">OFFLINE</span>
    </div>

    <div style="margin-top:12px">
      <span class="dot" id="connectionDot"></span>
      <span class="muted">MQTT BROKER</span>
    </div>
  </div>

  <div class="card">
    <div class="muted">STATUS PINTU</div>
    <div class="status" id="doorState">MENUNGGU</div>
    <div class="muted" id="doorDesc">Menunggu ESP32</div>

    <div class="actions">
      <button class="open" id="unlock" disabled>
        <span style="font-size:23px">↗</span><br>BUKA
      </button>
      <button class="close" id="lock" disabled>
        <span style="font-size:23px">⌑</span><br>KUNCI
      </button>
    </div>
  </div>

  <div class="card">
    <div class="muted">AKTIVITAS</div>
    <div id="log">Memulai...</div>
  </div>

  <button class="logout" onclick="logout()">KELUAR</button>
</section>

</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>
// ==================================
// KONFIGURASI MQTT - TETAP
// ==================================

const DEVICE_ID = "ariesharianto-smartlock-demo-7f3a91";
const DEMO_TOKEN = "ARIES-DEMO-LOCK-7F3A91";

const TOPIC_COMMAND = DEVICE_ID + "/command";
const TOPIC_STATUS = DEVICE_ID + "/status";
const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";

// ==================================
// LOGIN DEMO
// ==================================

// GANTI PASSWORD INI
const APP_PASSWORD = "123456";

let client;
let authenticated = false;

function loginPassword() {
  const pass = document.getElementById("password").value;

  if(pass === APP_PASSWORD) {
    enterDashboard();
  } else {
    document.getElementById("loginMessage").textContent =
      "Password salah!";
  }
}

// ==================================
// FINGERPRINT / PASSKEY
// ==================================

// Memerlukan passkey yang sudah terdaftar.
// Tombol ini tidak otomatis mendaftarkan sidik jari.
async function loginFingerprint() {

  if(!window.PublicKeyCredential) {
    alert("Perangkat atau browser tidak mendukung WebAuthn.");
    return;
  }

  alert(
    "Fingerprint memerlukan passkey yang sudah didaftarkan " +
    "oleh layanan autentikasi. Versi HTML mandiri ini belum " +
    "memiliki server untuk registrasi dan verifikasi passkey."
  );
}

// ==================================
// DASHBOARD
// ==================================

function enterDashboard() {
  authenticated = true;

  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  startMQTT();
}

function logout() {
  authenticated = false;

  if(client) {
    client.end(true);
    client = null;
  }

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("password").value = "";

  setConnection(false,"OFFLINE");
}

// ==================================
// MQTT - PROTOKOL TETAP
// ==================================

const $ = id => document.getElementById(id);

const unlockButton = $("unlock");
const lockButton = $("lock");

function setConnection(connected,text) {
  $("connectionDot").className =
    connected ? "dot on" : "dot";

  $("connectionText").textContent = text;

  unlockButton.disabled = !connected;
  lockButton.disabled = !connected;
}

function showStatus(message) {

  const parts = message.split("|");
  const state = parts[0];

  if(state === "UNLOCKED") {
    $("doorState").textContent = "TERBUKA";
    $("doorState").style.color = "#22c55e";
    $("doorDesc").textContent = "Pintu berhasil dibuka";
  }

  else if(state === "LOCKED") {
    $("doorState").textContent = "TERKUNCI";
    $("doorState").style.color = "#cbd5e1";
    $("doorDesc").textContent = "Pintu berhasil dikunci";
  }

  else return;

  $("log").textContent =
    "Terakhir diperbarui: " +
    new Date().toLocaleTimeString();
}

function sendCommand(command) {

  if(!authenticated || !client || !client.connected) return;

  client.publish(
    TOPIC_COMMAND,
    command + "|" + DEMO_TOKEN,
    {qos:0,retain:false}
  );

  $("log").textContent =
    command === "UNLOCK"
    ? "Perintah buka dikirim..."
    : "Perintah kunci dikirim...";
}

unlockButton.addEventListener("click",() => sendCommand("UNLOCK"));
lockButton.addEventListener("click",() => sendCommand("LOCK"));

function startMQTT() {

  if(typeof mqtt === "undefined") {
    $("log").textContent = "MQTT.js gagal dimuat";
    return;
  }

  const clientId =
    "webSmartLock_" + Math.random().toString(16).slice(2,10);

  client = mqtt.connect(BROKER_URL,{
    clientId,
    clean:true,
    connectTimeout:10000,
    reconnectPeriod:3000
  });

  client.on("connect",() => {

    setConnection(true,"ONLINE");

    client.subscribe(TOPIC_STATUS,{qos:0},err => {
      $("log").textContent = err
        ? "Gagal menerima status"
        : "Terhubung ke Wokwi";
    });

  });

  client.on("reconnect",() =>
    setConnection(false,"MENGHUBUNGKAN")
  );

  client.on("offline",() =>
    setConnection(false,"OFFLINE")
  );

  client.on("error",err => {
    setConnection(false,"ERROR");
    $("log").textContent = "MQTT: " + err.message;
  });

  client.on("message",(topic,payload) => {
    if(topic === TOPIC_STATUS) {
      showStatus(payload.toString());
    }
  });
}
</script>
</body>
</html>
